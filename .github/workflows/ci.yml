name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          # Read the version from go.mod so there is one source of truth.
          go-version-file: go.mod
          # shale has no third-party dependencies, so there is no go.sum and
          # nothing to cache. Without this, setup-go warns on every run.
          cache: false

      # gofmt -l only lists files, it never fails, so the exit code has to be
      # forced or unformatted code sails through CI.
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: vet
        run: go vet ./...

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      # Report both platforms rather than hiding one behind the other's failure.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: build
        run: go build ./...

      # Both platforms matter for a storage engine: the pager does real file
      # I/O, and Sync maps to F_FULLFSYNC on darwin but plain fsync on linux.
      - name: test
        run: go test -race -count=1 -timeout 5m ./...
